[ai-opencode]
image=archlinux:latest
pull=true

additional_packages="git nodejs npm"
init_hooks="HOME=/root XDG_CONFIG_HOME=/root/.config XDG_DATA_HOME=/root/.local/share XDG_STATE_HOME=/root/.local/state XDG_CACHE_HOME=/root/.cache npm_config_cache=/var/cache/npm npm install -g @opencode/cli --allow-scripts=@opencode/cli"
exported_bins="/usr/bin/opencode"

