format = """
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$rust\
$cpp\
$package\
$jobs\
$cmd_duration\
$line_break\
$character"""

add_newline = false
palette = 'catppuccin_mocha'

[hostname]
ssh_only = true
format = '[$hostname](bold maroon) '
trim_at = '.'

[directory]
style = 'sky'
format = '[$read_only]($read_only_style) [$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
read_only = ''
read_only_style = 'bold red'

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:rosewater'
symbol = ' '
format = '[on](pink) [$symbol$branch ]($style)'

[git_status]
style = 'fg:flamingo'
format = '([$all_status$ahead_behind]($style) )'
deleted = '✘\(${count}\) '
untracked = '?\(${count}\) '
ahead = '⇡\(${count}\) '  
behind = '⇣\(${behind_count}\) '
staged = '+\(${count}\) '
modified = '!\(${count}\) '

[fill]
symbol = ' '

[python]
style = 'sapphire'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[cpp]
style = 'teal'
symbol = ' '
format = '[${symbol}(${version} )]{$style}'

[lua]
style = 'yellow'
symbol = ' '
format = '[${symbol}(${version} )]($style)'

[rust]
style = 'peach'
symbol = ' '
format = '[${symbol}(${version} )]($style)'

[package]
symbol = '󰏗 '

[docker_context]
symbol = ' '
style = 'blue'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:current_line'
format = '[$duration]($style)'

